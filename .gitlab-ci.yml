# GitLab CI — mirror of .github/workflows/ci.yml.
# `pages` deploys the static export to GitLab Pages at
# https://<namespace>.gitlab.io/<project>/ (BASE_PATH set accordingly).
# For a custom domain or user/group site, set BASE_PATH: '' below.

# Pinned to the same image tag the GitHub workflow resolves from .nvmrc.
image: node:22.23.3

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

stages:
  - check
  - deploy

check:
  stage: check
  script:
    - npm ci --cache .npm --prefer-offline
    # Production-scoped: the shipped export stays advisory-free. Consults the live
    # advisory database, so it can turn red with no commit changing.
    - npm audit --omit=dev --audit-level=high
    - npm run check:version
    - npm run typecheck
    - npm run lint
    - npm run check:gates
    - npm run check:citations
    - npm run format:check
    - BASE_PATH="/$CI_PROJECT_NAME" npm run build
    - npm test
    - npm run check:csp
    - npm run budget:bundle
    - npm run budget:performance
    - npx playwright install --with-deps chromium
    - BASE_PATH="/$CI_PROJECT_NAME" npm run test:e2e

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check:version
    - BASE_PATH="/$CI_PROJECT_NAME" npm run build
    - mv out public
  artifacts:
    paths:
      - public
